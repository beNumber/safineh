{% extends 'quiz_module/base.html' %}{% block content %}<div class="mx-auto max-w-5xl space-y-4"><h1 class="text-2xl font-black">تأیید آزمون‌ها</h1>{% for quiz in quizzes %}<article class="rounded-2xl border bg-white p-5"><h2 class="font-black">{{ quiz.title }}</h2><p class="text-sm text-slate-500">ایجادکننده: {{ quiz.creator }}</p><form method="post" class="mt-4 flex gap-2">{% csrf_token %}<input name="note" class="rounded-lg border p-2" placeholder="یادداشت"><button name="decision" value="approved" class="rounded-lg bg-emerald-600 px-4 py-2 text-white">تأیید</button><button name="decision" value="rejected" class="rounded-lg bg-red-600 px-4 py-2 text-white">رد</button></form></article>{% empty %}<p>موردی برای بررسی نیست.</p>{% endfor %}</div>{% endblock %}
