{% extends 'quiz_module/base.html' %}{% block content %}<div class="mx-auto max-w-4xl"><h1 class="mb-5 text-2xl font-black">{{ attempt.quiz.title }}</h1><form method="post" action="{% url 'quiz_module:submit' attempt.pk %}" class="space-y-5">{% csrf_token %}{% for q in questions %}<section class="rounded-2xl border bg-white p-5"><h2 class="font-bold">{{ forloop.counter }}. {{ q.text|safe }}</h2>{% if q.image %}<img src="{{ q.image.url }}" class="my-3 max-h-56 rounded-xl">{% endif %}<div class="mt-4 space-y-2">{% for c in q.choices.all %}<label class="block rounded-xl border p-3"><input type="radio" name="q_{{ q.pk }}" value="{{ c.pk }}"> {{ c.text|safe }}</label>{% endfor %}</div></section>{% endfor %}<button class="rounded-xl bg-blue-600 px-6 py-3 font-bold text-white">ثبت نهایی آزمون</button></form></div>{% endblock %}
