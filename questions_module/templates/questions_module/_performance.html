{% load static %}{% if performance %}<section class="qb-card p-6"><h2 class="font-black text-slate-800">نمودار وضعیت درس‌ها</h2><p class="mb-5 mt-1 text-xs text-slate-500">بر اساس تمام تمرین‌ها و آزمون‌های ذخیره‌شده</p><div class="h-64"><canvas id="course-performance-chart"></canvas></div><div class="mt-6 grid gap-4 md:grid-cols-2">{% for item in performance %}<div><div class="mb-2 flex justify-between text-xs"><strong>{{ item.name }}</strong><span>{{ item.percent }}٪ · {{ item.total }} پاسخ</span></div><div class="qb-progress"><span style="width:{{ item.percent }}%"></span></div></div>{% endfor %}</div></section>{{ performance|json_script:"course-performance-data" }}<script src="{% static 'chart/chart.js' %}"></script><script>document.addEventListener('DOMContentLoaded',()=>{const canvas=document.getElementById('course-performance-chart');if(!canvas||typeof Chart==='undefined')return;const rows=JSON.parse(document.getElementById('course-performance-data').textContent);new Chart(canvas,{type:'bar',data:{labels:rows.map(x=>x.name),datasets:[{label:'درصد پاسخ صحیح',data:rows.map(x=>x.percent),backgroundColor:'#3b82f6',borderRadius:8}]},options:{maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:100}},plugins:{legend:{display:false}}}})});</script>{% endif %}
