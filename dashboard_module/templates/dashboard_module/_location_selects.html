<select name="province" aria-label="فیلتر استان" onchange="this.form.requestSubmit()" class="min-w-36 rounded-2xl border border-indigo-100 bg-white px-3 py-2.5 text-xs font-bold text-slate-700"><option value="">همه استان‌ها</option>{% for province in filter_provinces %}<option value="{{ province.pk }}" {% if selected_province == province.pk %}selected{% endif %}>{{ province }}</option>{% endfor %}</select>
<select name="school" aria-label="فیلتر مدرسه" class="min-w-36 rounded-2xl border border-indigo-100 bg-white px-3 py-2.5 text-xs font-bold text-slate-700"><option value="">همه مدرسه‌ها</option>{% for school in filter_schools %}<option value="{{ school.pk }}" {% if selected_school == school.pk %}selected{% endif %}>{{ school.name }}</option>{% endfor %}</select>
